name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK (install directly on your phone for testing)
        working-directory: android
        run: gradle assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: cello-bow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Decode upload keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle (upload this to Google Play)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: cello-bow-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Explain missing release bundle
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::notice::No ANDROID_KEYSTORE_BASE64 secret set, so only the debug APK was built. See ANDROID.md to add your upload key and get a Play-ready .aab."
